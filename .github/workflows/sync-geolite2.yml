name: Sync GeoIP Databases

on:
  schedule:
    - cron: '13 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download GeoIP Legacy databases from mailfud.org (v1)
        run: |
          BASE="https://mailfud.org/geoip-legacy"
          mkdir -p tmp/v1 v1

          FILES=(
            GeoIP.dat.gz        GeoIPv6.dat.gz
            GeoIPCity.dat.gz    GeoIPCityv6.dat.gz
            GeoIPASNum.dat.gz   GeoIPASNumv6.dat.gz
            GeoIPISP.dat.gz     GeoIPISPv6.dat.gz
            GeoIPOrg.dat.gz     GeoIPOrgv6.dat.gz
          )

          for f in "${FILES[@]}"; do
            echo ":: Downloading $f"
            curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors --max-time 120 \
              "$BASE/$f" -o "tmp/v1/$f"

            gzip -t "tmp/v1/$f" \
              || { echo "ERROR: $f failed gzip integrity check"; exit 1; }

            SIZE=$(stat -c%s "tmp/v1/$f")
            [ "$SIZE" -lt 50000 ] \
              && { echo "ERROR: $f is suspiciously small (${SIZE} bytes)"; exit 1; }

            echo "OK: $f (${SIZE} bytes)"
          done

          mv tmp/v1/* v1/

      - name: Download GeoLite2 databases from P3TERX (v2)
        run: |
          BASE="https://github.com/P3TERX/GeoLite.mmdb/releases/latest/download"
          mkdir -p tmp/v2 v2

          FILES=(GeoLite2-ASN.mmdb GeoLite2-City.mmdb GeoLite2-Country.mmdb)

          for f in "${FILES[@]}"; do
            echo ":: Downloading $f"
            curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors --max-time 120 \
              "$BASE/$f" -o "tmp/v2/$f"

            python3 - "tmp/v2/$f" <<'EOF'
          import sys
          path = sys.argv[1]
          with open(path, 'rb') as fh:
              content = fh.read()
          if b'MaxMind.com' not in content[-512:]:
              print(f"ERROR: {path} is not a valid MMDB file (missing MaxMind metadata)")
              sys.exit(1)
          EOF

            SIZE=$(stat -c%s "tmp/v2/$f")
            [ "$SIZE" -lt 1000000 ] \
              && { echo "ERROR: $f is suspiciously small (${SIZE} bytes)"; exit 1; }

            echo "OK: $f (${SIZE} bytes)"
          done

          mv tmp/v2/* v2/

      - name: Build MaxMind-format Country CSV set
        run: |
          mkdir -p csv tmp
          python3 -m pip install --upgrade maxminddb

          python3 scripts/build_opnsense_geoip.py \
            --mmdb v2/GeoLite2-Country.mmdb \
            --out-dir tmp/opnsense \
            --epoch-file tmp/build_epoch \
            || { echo "ERROR: CSV build failed"; exit 1; }

      - name: Package CSV set as ZIP
        run: |
          command -v zip >/dev/null 2>&1 || {
            sudo apt-get update -qq \
              && sudo apt-get install -y --no-install-recommends zip unzip \
              || { echo "ERROR: could not install zip/unzip"; exit 1; }
          }

          # Stamp the members with the MMDB's own build_epoch rather than "now".
          # Two reasons: OPNsense surfaces the locations member's ZIP timestamp
          # as the database date, and a fixed timestamp plus `zip -X` makes the
          # archive byte-identical when the source data has not changed, so
          # "Commit if changed" stays a real no-op instead of committing a fresh
          # 4 MB blob every single day.
          TS=$(date -u -d "@$(cat tmp/build_epoch)" '+%Y-%m-%d %H:%M:%S')
          echo ":: stamping members with $TS UTC (MMDB build_epoch)"
          find tmp/opnsense -name '*.csv' -exec touch -d "$TS UTC" {} +

          # -j flatten (OPNsense matches on basename), -X drop uid/gid+extended
          # timestamps, -FS make the archive a clean rebuild rather than a sync.
          zip -9 -j -X -FS csv/GeoLite2-Country-CSV.zip \
            tmp/opnsense/GeoLite2-Country-Locations-en.csv \
            tmp/opnsense/GeoLite2-Country-Blocks-IPv4.csv \
            tmp/opnsense/GeoLite2-Country-Blocks-IPv6.csv \
            || { echo "ERROR: zip failed"; exit 1; }

          unzip -t csv/GeoLite2-Country-CSV.zip \
            || { echo "ERROR: ZIP failed integrity check"; exit 1; }

      - name: Verify ZIP against OPNsense parser rules
        run: |
          # Replays OPNsense's process_zip logic. Its failure mode is silent —
          # a wrongly named member makes it parse nothing without raising — so
          # this has to assert on parsed output, not just on the file existing.
          python3 scripts/verify_opnsense_geoip.py csv/GeoLite2-Country-CSV.zip \
            || { echo "ERROR: archive is not OPNsense-compatible"; exit 1; }

          echo "OK: csv/GeoLite2-Country-CSV.zip ($(stat -c%s csv/GeoLite2-Country-CSV.zip) bytes)"
          rm -rf tmp

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add v1/ v2/ csv/
          if git diff --cached --quiet; then
            echo "No changes detected, skipping commit."
          else
            git commit -m "chore: sync GeoIP databases [$(date -u +%Y-%m-%d)]"
            git push
          fi
