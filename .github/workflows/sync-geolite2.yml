name: Sync GeoIP Databases

on:
  schedule:
    - cron: '13 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download GeoIP Legacy databases from mailfud.org (v1)
        run: |
          BASE="https://mailfud.org/geoip-legacy"
          mkdir -p tmp/v1 v1

          FILES=(
            GeoIP.dat.gz        GeoIPv6.dat.gz
            GeoIPCity.dat.gz    GeoIPCityv6.dat.gz
            GeoIPASNum.dat.gz   GeoIPASNumv6.dat.gz
            GeoIPISP.dat.gz     GeoIPISPv6.dat.gz
            GeoIPOrg.dat.gz     GeoIPOrgv6.dat.gz
          )

          for f in "${FILES[@]}"; do
            echo ":: Downloading $f"
            curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors --max-time 120 \
              "$BASE/$f" -o "tmp/v1/$f"

            gzip -t "tmp/v1/$f" \
              || { echo "ERROR: $f failed gzip integrity check"; exit 1; }

            SIZE=$(stat -c%s "tmp/v1/$f")
            [ "$SIZE" -lt 50000 ] \
              && { echo "ERROR: $f is suspiciously small (${SIZE} bytes)"; exit 1; }

            echo "OK: $f (${SIZE} bytes)"
          done

          mv tmp/v1/* v1/

      - name: Download GeoLite2 databases from P3TERX (v2)
        run: |
          BASE="https://github.com/P3TERX/GeoLite.mmdb/releases/latest/download"
          mkdir -p tmp/v2 v2

          FILES=(GeoLite2-ASN.mmdb GeoLite2-City.mmdb GeoLite2-Country.mmdb)

          for f in "${FILES[@]}"; do
            echo ":: Downloading $f"
            curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors --max-time 120 \
              "$BASE/$f" -o "tmp/v2/$f"

            python3 - "tmp/v2/$f" <<'EOF'
          import sys
          path = sys.argv[1]
          with open(path, 'rb') as fh:
              content = fh.read()
          if b'MaxMind.com' not in content[-512:]:
              print(f"ERROR: {path} is not a valid MMDB file (missing MaxMind metadata)")
              sys.exit(1)
          EOF

            SIZE=$(stat -c%s "tmp/v2/$f")
            [ "$SIZE" -lt 1000000 ] \
              && { echo "ERROR: $f is suspiciously small (${SIZE} bytes)"; exit 1; }

            echo "OK: $f (${SIZE} bytes)"
          done

          mv tmp/v2/* v2/

      - name: Convert GeoLite2 Country MMDB to CSV
        run: |
          mkdir -p csv
          python3 -m pip install --upgrade maxminddb

          python3 - <<'EOF'
          import csv
          import sys

          import maxminddb

          reader = maxminddb.open_database('v2/GeoLite2-Country.mmdb')
          rows = 0

          with open('csv/GeoLite2-Country.csv', 'w', newline='', encoding='utf-8') as f:
              writer = csv.writer(f)
              writer.writerow(['network', 'geoname_id', 'country_iso_code', 'country_name'])

              for network, data in reader:
                  country_data = data.get('country') or data.get('registered_country') or {}

                  writer.writerow([
                      str(network),
                      country_data.get('geoname_id', ''),
                      country_data.get('iso_code', ''),
                      country_data.get('names', {}).get('en', ''),
                  ])
                  rows += 1

          reader.close()

          print(f"Wrote {rows} rows to csv/GeoLite2-Country.csv")
          if rows < 100000:
              print("ERROR: suspiciously few rows, aborting")
              sys.exit(1)
          EOF

          echo "Successfully converted MMDB to CSV!"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add v1/ v2/ csv/
          if git diff --cached --quiet; then
            echo "No changes detected, skipping commit."
          else
            git commit -m "chore: sync GeoIP databases [$(date -u +%Y-%m-%d)]"
            git push
          fi
